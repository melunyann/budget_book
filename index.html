<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kakeibo | ふわふわ家計簿</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
:root{--bg:#f4f9fe;--bg2:#e7f3fc;--card:#fff;--main:#bcdff5;--deep:#80b8e0;--soft:#eef7fd;--text:#4a6785;--sub:#a1b6c8;--exp:#a3bcea;--line:#e2eff9;--mk:#4a6279;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17202b;--bg2:#1c2a3a;--card:#1f2d3c;--main:#6fb2e0;--deep:#8cc6ee;--soft:#27405a;--text:#e1edf7;--sub:#8fa6bb;--exp:#9db8f0;--line:#2c4157;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17202b;--bg2:#1c2a3a;--card:#1f2d3c;--main:#6fb2e0;--deep:#8cc6ee;--soft:#27405a;--text:#e1edf7;--sub:#8fa6bb;--exp:#9db8f0;--line:#2c4157;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 260px) var(--bg);background-repeat:no-repeat;color:var(--text);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-size:14px;letter-spacing:.03em}
svg{vertical-align:-2px}
.wrap{max-width:540px;margin:0 auto;padding:22px 14px 64px}
.hd{text-align:center;margin-bottom:10px;color:var(--deep)}
.hd h1{margin:0;font:italic 600 38px "Cormorant Garamond",Georgia,serif;letter-spacing:.06em}
.hd p{margin:2px 0 0;font-size:11px;color:var(--sub);letter-spacing:.3em}
nav{display:flex;justify-content:center;gap:4px;padding:8px 0 12px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg2) 70%,transparent)}
nav button{border:0;background:none;padding:7px 10px;font:inherit;font-size:13px;color:var(--sub);cursor:pointer;border-bottom:1.5px solid transparent;letter-spacing:.12em}
nav button.on{color:var(--deep);border-color:var(--main);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(106,166,209,.10)}
h2{margin:0 0 12px;display:flex;align-items:baseline;gap:8px;font-weight:500}
h2 i{font:italic 600 21px "Cormorant Garamond",Georgia,serif;color:var(--deep);letter-spacing:.05em}
h2 small{font-size:11px;color:var(--sub);letter-spacing:.15em}
label{display:block;font-size:11px;color:var(--sub);margin:12px 0 4px;letter-spacing:.15em}
input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--bg);color:var(--text)}
input:focus,textarea:focus{outline:none;border-color:var(--main);box-shadow:0 0 0 3px var(--soft)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--bg)}
.seg button{flex:1;border:0;border-radius:999px;padding:8px;background:none;font:inherit;color:var(--sub);cursor:pointer;letter-spacing:.2em}
.seg button.on{background:var(--main);color:#3a6585;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font:inherit;font-size:12px;color:var(--text);cursor:pointer}
.chip.on{border-color:var(--main);background:var(--soft);font-weight:700}
.mk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:700;color:#4a6279;flex:none}
.main{width:100%;margin-top:18px;border:0;border-radius:999px;padding:12px;background:linear-gradient(135deg,var(--main),var(--deep));color:#3a6585;font:inherit;font-weight:700;font-size:14px;letter-spacing:.25em;cursor:pointer;box-shadow:0 6px 14px rgba(106,166,209,.3)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.sum div{padding:4px 2px;border-right:1px solid var(--line)}
.sum div:last-child{border:0}
.sum small{display:block;color:var(--sub);font-size:10px;letter-spacing:.2em;margin-bottom:3px}
.sum b{font-size:14px;font-weight:700}
.e{color:var(--exp)}.i{color:var(--deep)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.rt{flex:1;min-width:0}.rt b{display:block;font-size:13px;font-weight:500}.rt small{color:var(--sub);font-size:11px;overflow-wrap:anywhere}
.amt{font-weight:700;font-size:13px;white-space:nowrap}
.x{border:0;background:none;color:var(--sub);font-size:18px;line-height:1;cursor:pointer;padding:2px 4px}
.nv{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 14px}
.nv button{border:1px solid var(--line);background:var(--card);color:var(--deep);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
.nv span{font:italic 600 19px "Cormorant Garamond","Zen Maru Gothic",serif;color:var(--deep);letter-spacing:.05em}
.bars{display:flex;gap:7px;align-items:flex-end;height:140px;margin-top:4px}
.bc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:9px;color:var(--sub);text-align:center}
.bc i{display:block;width:100%;max-width:26px;background:linear-gradient(var(--exp),#c5d6f5);border-radius:99px 99px 6px 6px;min-height:3px}
.bc em{font-style:normal;margin-top:5px;font-size:11px;color:var(--text);line-height:1.3}
.br{margin:10px 0}.br .t{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.br .t span:first-child{display:flex;align-items:center;gap:7px}
.br .b{height:6px;background:var(--bg);border-radius:99px;margin-top:5px;overflow:hidden}
.br .b i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#c5d6f5,var(--exp))}
.br.inc .b i{background:linear-gradient(90deg,var(--main),var(--deep))}
.empty{text-align:center;color:var(--sub);padding:14px;font-size:12px;letter-spacing:.1em}
.pg{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:99px;margin:12px 0 8px;position:relative}
.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--main),var(--deep));border-radius:99px}
.pg svg{position:absolute;top:-6px;color:var(--exp);margin-left:-9px;width:20px;height:20px}
.acts{display:flex;gap:6px;margin-top:12px}.acts input{flex:1}
.sm{border:1px solid var(--main);border-radius:999px;padding:0 14px;background:var(--soft);color:var(--deep);font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.two{display:flex;gap:6px}
.gt{display:flex;justify-content:space-between;align-items:center}
.gt .nm{display:flex;align-items:center;gap:8px;font-weight:700}
.big{font:italic 600 30px "Cormorant Garamond",Georgia,serif;color:var(--deep)}
.dn p{margin:8px 0 4px;white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere}.dn small{color:var(--sub);font-size:11px}.dd{font:italic 600 17px "Cormorant Garamond","Zen Maru Gothic",serif;color:var(--deep)}textarea{resize:vertical;min-height:110px;line-height:1.7}
.orn{display:block;margin:0 auto 4px;color:var(--main)}
.acct{text-align:right;min-height:26px}.acct button{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:4px 12px;font:inherit;font-size:11px;cursor:pointer}.acct span{font-size:11px;color:var(--deep);margin-right:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="acct" id="acct"></div>
  <div class="hd"><svg class="orn" id="orn" width="16" height="16" viewBox="0 0 24 24"></svg></div>
  <nav id="nav"></nav>
  <div id="app"></div>
</div>
<script>
const K='kakeibo-v2';
const SP='<path d="M12 2c.8 5.2 2.8 7.2 8 8-5.2.8-7.2 2.8-8 8-.8-5.2-2.8-7.2-8-8 5.2-.8 7.2-2.8 8-8z" fill="currentColor"/>';
const spark=(n)=>`<svg width="${n}" height="${n}" viewBox="0 0 24 24">${SP}</svg>`;
const heart='<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 2.8 4.8 6.2 4.8c2.1 0 3.9 1.2 5.8 3.4 1.9-2.2 3.7-3.4 5.8-3.4 3.4 0 5.3 3.5 3.8 7-2.1 4.6-9.6 9.2-9.6 9.2z" fill="currentColor"/></svg>';
const PAL=['#cfe6f7','#f7d3dc','#ddd6f3','#d3eee6','#fbe6c8','#e4efc9','#f4d5ec','#cde9f1'];
const mkc=(a)=>a.map((n,i)=>({n:n,c:i%8}));
const DEF=()=>({tx:[],cats:{exp:mkc(['食費','日用品','交通','住居','光熱費','通信','美容','カフェ','趣味']),inc:mkc(['給料','おこづかい','副収入'])},goals:[]});
let S=load();if(!S.diary)S.diary=[];
function load(){
  try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.tx&&d.cats&&d.goals)return d}catch(e){}
  try{const o=JSON.parse(localStorage.getItem('kakeibo-v1'));if(o&&o.tx&&o.cats&&o.goals){
    const f=a=>a.map((c,i)=>({n:c.n,c:i%8}));
    return {tx:o.tx,cats:{exp:f(o.cats.exp),inc:f(o.cats.inc)},goals:o.goals.map((g,i)=>({id:g.id,n:g.n,target:g.target,saved:g.saved,c:i%8}))}}}catch(e){}
  return DEF();
}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(window.cloudPush)window.cloudPush()}
function applyCloud(j){try{S=JSON.parse(j);if(!S.diary)S.diary=[];localStorage.setItem(K,j)}catch(e){return}keep();keepD();render()}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>Math.round(n).toLocaleString('ja-JP')+'円';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amt,0);
const mk=()=>'';
const mkt=(t,n)=>{const c=S.cats[t].find(c=>c.n===n);return mk(n,c?c.c:0)};
const sh=(en,jp)=>`<h2><i>${en}</i><small>${jp}</small></h2>`;
const TABS=[['home','きろく'],['week','週'],['month','月'],['save','貯金'],['diary','日記'],['set','項目']];
let tab='home',wOff=0,mOff=0;
let F={type:'exp',cat:0,date:ymd(new Date()),amt:'',memo:''};

function keep(){const a=$('#fd');if(a){F.date=a.value;F.amt=$('#fa').value;F.memo=$('#fm').value}}
function setTab(t){tab=t;render()}
function setType(t){keep();F.type=t;F.cat=0;render()}
function setCat(i){keep();F.cat=i;render()}
function addTx(){
  keep();const amt=Math.floor(Number(F.amt));const c=S.cats[F.type][F.cat];
  if(!(amt>0)||!F.date||!c){alert('金額と項目を入れてね');return}
  S.tx.push({id:uid(),date:F.date,type:F.type,cat:c.n,amt:amt,memo:F.memo.trim()});
  save();F.amt='';F.memo='';render();
}
function delTx(id){if(confirm('このきろくを消す？')){S.tx=S.tx.filter(t=>t.id!==id);save();render()}}

function rows(list){
  if(!list.length)return '<div class="empty">まだなにもないよ</div>';
  return list.map(t=>`<div class="row">${mkt(t.type,t.cat)}<div class="rt"><b>${esc(t.cat)}</b><small>${t.date.slice(5).replace('-','/')} ${esc(t.memo)}</small></div><span class="amt ${t.type==='exp'?'e':'i'}">${t.type==='exp'?'-':'+'}${yen(t.amt)}</span><button class="x" onclick="delTx(${t.id})">×</button></div>`).join('');
}
function summary(a){
  const e=sum(a,'exp'),i=sum(a,'inc');
  return `<div class="sum"><div><small>INCOME</small><b class="i">${yen(i)}</b></div><div><small>EXPENSE</small><b class="e">${yen(e)}</b></div><div><small>BALANCE</small><b>${yen(i-e)}</b></div></div>`;
}
function breakdown(a,t){
  const m={};a.filter(x=>x.type===t).forEach(x=>m[x.cat]=(m[x.cat]||0)+x.amt);
  const ent=Object.entries(m).sort((x,y)=>y[1]-x[1]);const tot=ent.reduce((s,x)=>s+x[1],0);
  if(!ent.length)return '<div class="empty">まだなにもないよ</div>';
  return ent.map(([n,v])=>`<div class="br ${t}"><div class="t"><span>${mkt(t,n)}${esc(n)}</span><span>${yen(v)}</span></div><div class="b"><i style="width:${(v/tot*100).toFixed(1)}%"></i></div></div>`).join('');
}

function vHome(){
  const now=new Date(),pre=now.getFullYear()+'-'+pad(now.getMonth()+1);
  const a=S.tx.filter(t=>t.date.startsWith(pre)).sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id);
  return `<div class="card">${sh('Write','きろくする')}<div class="seg"><button class="${F.type==='exp'?'on':''}" onclick="setType('exp')">支出</button><button class="${F.type==='inc'?'on':''}" onclick="setType('inc')">収入</button></div>
  <label>DATE</label><input type="date" id="fd" value="${esc(F.date)}">
  <label>AMOUNT（円）</label><input type="number" id="fa" inputmode="numeric" min="0" placeholder="0" value="${esc(F.amt)}">
  <div class="chips">${S.cats[F.type].map((c,i)=>`<button class="chip ${i===F.cat?'on':''}" onclick="setCat(${i})">${mk(c.n,c.c)}${esc(c.n)}</button>`).join('')}</div>
  <label>MEMO</label><input id="fm" maxlength="40" placeholder="ひとこと（なくてもOK）" value="${esc(F.memo)}">
  <button class="main" onclick="addTx()">きろくする ${spark(12)}</button></div>
  <div class="card">${sh('This month',now.getMonth()+1+'月のようす')}${summary(a)}</div>
  <div class="card">${sh('Notebook','今月のきろく')}${rows(a.slice(0,40))}</div>`;
}

function vWeek(){
  const n=new Date();const d=(n.getDay()+6)%7;
  const ws=new Date(n.getFullYear(),n.getMonth(),n.getDate()-d+wOff*7);
  const we=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6);
  const a=S.tx.filter(t=>t.date>=ymd(ws)&&t.date<=ymd(we)).sort((x,y)=>y.date.localeCompare(x.date));
  const days=[];for(let k=0;k<7;k++)days.push(new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+k));
  const vals=days.map(dd=>sum(a.filter(t=>t.date===ymd(dd)),'exp'));const mx=Math.max(...vals,1);
  const nm='月火水木金土日';
  const bars=days.map((dd,k)=>`<div class="bc"><span>${vals[k]?vals[k].toLocaleString('ja-JP'):''}</span><i style="height:${(vals[k]/mx*80).toFixed(0)}px"></i><em>${nm[k]}<br>${dd.getDate()}</em></div>`).join('');
  return `<div class="nv"><button onclick="wOff--;render()">‹</button><span>${ws.getMonth()+1}/${ws.getDate()} – ${we.getMonth()+1}/${we.getDate()}${wOff===0?'  now':''}</span><button onclick="wOff++;render()">›</button></div>
  <div class="card">${sh('Weekly','この週のまとめ')}${summary(a)}</div>
  <div class="card">${sh('Daily','日ごとの支出')}<div class="bars">${bars}</div></div>
  <div class="card">${sh('Category','支出の内訳')}${breakdown(a,'exp')}</div>
  <div class="card">${sh('Notebook','この週のきろく')}${rows(a)}</div>`;
}

function vMonth(){
  const n=new Date();const m=new Date(n.getFullYear(),n.getMonth()+mOff,1);
  const pre=m.getFullYear()+'-'+pad(m.getMonth()+1);
  const a=S.tx.filter(t=>t.date.startsWith(pre));
  const last=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  const wk=[];for(let k=1;k<=Math.ceil(last/7);k++){
    const s=(k-1)*7+1,e=Math.min(k*7,last);
    const w=a.filter(t=>{const dd=Number(t.date.slice(8));return dd>=s&&dd<=e});
    wk.push({k,s,e,v:sum(w,'exp')});
  }
  const mx=Math.max(...wk.map(w=>w.v),1);
  const wr=wk.map(w=>`<div class="br"><div class="t"><span>第${w.k}週（${w.s}〜${w.e}日）</span><span>${yen(w.v)}</span></div><div class="b"><i style="width:${(w.v/mx*100).toFixed(1)}%"></i></div></div>`).join('');
  return `<div class="nv"><button onclick="mOff--;render()">‹</button><span>${m.getFullYear()}.${pad(m.getMonth()+1)}${mOff===0?'  now':''}</span><button onclick="mOff++;render()">›</button></div>
  <div class="card">${sh('Monthly','この月のまとめ')}${summary(a)}</div>
  <div class="card">${sh('Week by week','週ごとの支出')}${wr}</div>
  <div class="card">${sh('Expense','支出の内訳')}${breakdown(a,'exp')}</div>
  <div class="card">${sh('Income','収入の内訳')}${breakdown(a,'inc')}</div>`;
}

function vSave(){
  const tot=S.goals.reduce((s,g)=>s+g.saved,0);
  const gs=S.goals.map(g=>{
    const p=g.target>0?Math.min(100,g.saved/g.target*100):0;
    return `<div class="card"><div class="gt"><span class="nm">${mk(g.n,g.c)}${esc(g.n)}</span><button class="x" onclick="delGoal(${g.id})">×</button></div>
    <div class="pg"><i style="width:${p.toFixed(1)}%"></i>${p>0?`<span style="position:absolute;left:${p.toFixed(1)}%;top:0">${heart}</span>`:''}</div>
    <div class="gt"><b>${yen(g.saved)}</b><span style="color:var(--sub);font-size:11px">${g.target>0?'目標 '+yen(g.target)+'（'+Math.floor(p)+'%）':'目標なし'}</span></div>
    <div class="acts"><input type="number" inputmode="numeric" min="0" id="g${g.id}" placeholder="金額"><button class="sm" onclick="gMove(${g.id},1)">入れる</button><button class="sm" onclick="gMove(${g.id},-1)">出す</button></div></div>`;
  }).join('');
  return `<div class="card" style="text-align:center">${sh('Savings','積み立て・貯金ぜんぶ').replace('<h2>','<h2 style="justify-content:center">')}<div class="big">${yen(tot)}</div></div>
  ${gs||'<div class="empty">貯金の枠をつくってみてね</div>'}
  <div class="card">${sh('New pot','あたらしい枠')}
  <label>NAME</label><input id="gn" maxlength="16" placeholder="旅行、ひっこし、おでかけ…">
  <label>TARGET（目標金額・なくてもOK）</label><input type="number" id="gt" inputmode="numeric" min="0" placeholder="0"><button class="main" onclick="addGoal()">つくる ${spark(12)}</button></div>`;
}
function addGoal(){
  const n=$('#gn').value.trim();if(!n){alert('なまえを入れてね');return}
  S.goals.push({id:uid(),n:n,c:S.goals.length%8,target:Math.max(0,Math.floor(Number($('#gt').value))||0),saved:0});
  save();render();
}
function gMove(id,s){
  const g=S.goals.find(x=>x.id===id);const v=Math.floor(Number($('#g'+id).value));
  if(!g||!(v>0))return;
  g.saved=Math.max(0,g.saved+s*v);save();render();
}
function delGoal(id){if(confirm('この枠を消す？（貯金額もきえるよ）')){S.goals=S.goals.filter(g=>g.id!==id);save();render()}}

function vSet(){
  const blk=(t,en,jp)=>`<div class="card">${sh(en,jp)}<div class="chips" style="margin:0 0 14px">${S.cats[t].map((c,i)=>`<span class="chip">${mk(c.n,c.c)}${esc(c.n)}<button class="x" style="font-size:15px;padding:0 0 0 2px" onclick="delCat('${t}',${i})">×</button></span>`).join('')}</div>
  <div class="two"><input id="cn-${t}" maxlength="12" placeholder="あたらしい項目"><button class="sm" onclick="addCat('${t}')">追加</button></div></div>`;
  return blk('exp','Expense','支出の項目')+blk('inc','Income','収入の項目')+'<div class="empty">データはこのブラウザの中に保存されるよ</div>';
}
function addCat(t){
  const n=$('#cn-'+t).value.trim();if(!n)return;
  if(S.cats[t].some(c=>c.n===n)){alert('もうあるよ');return}
  S.cats[t].push({n:n,c:S.cats[t].length%8});save();render();
}
function delCat(t,i){
  if(S.cats[t].length<=1){alert('最低ひとつは必要だよ');return}
  if(confirm('この項目を消す？（過去のきろくは残るよ）')){S.cats[t].splice(i,1);F.cat=0;save();render()}
}

let D={date:ymd(new Date()),text:''};
const WD='日月火水木金土';
const dEntry=d=>S.diary.find(x=>x.date===d);
function keepD(){const a=$('#dd');if(a){D.date=a.value;D.text=$('#dt').value}}
function dDate(){keepD();const e=dEntry(D.date);D.text=e?e.text:'';render()}
function saveDiary(){
  keepD();if(!D.date)return;const t=D.text.trim();const i=S.diary.findIndex(x=>x.date===D.date);
  if(!t){if(i>=0)S.diary.splice(i,1)}else if(i>=0)S.diary[i].text=t;else S.diary.push({date:D.date,text:t});
  save();D.text='';render();
}
function editDiary(d){const e=dEntry(d);if(!e)return;D.date=d;D.text=e.text;render();window.scrollTo({top:0,behavior:'smooth'})}
function delDiary(d){if(confirm('この日記を消す？')){S.diary=S.diary.filter(x=>x.date!==d);save();render()}}
function vDiary(){
  const list=[...S.diary].sort((a,b)=>b.date.localeCompare(a.date));
  const items=list.map(e=>{
    const w=WD[new Date(e.date+'T00:00:00').getDay()];
    const sp=sum(S.tx.filter(t=>t.date===e.date),'exp');
    return `<div class="card dn"><div class="gt"><span class="dd">${e.date.replace(/-/g,'.')} (${w})</span><span><button class="x" style="font-size:12px" onclick="editDiary('${e.date}')">編集</button><button class="x" onclick="delDiary('${e.date}')">×</button></span></div><p>${esc(e.text)}</p>${sp?`<small>この日の支出 ${yen(sp)}</small>`:''}</div>`;
  }).join('');
  return `<div class="card">${sh('Diary','日記をかく')}
  <label>DATE</label><input type="date" id="dd" value="${esc(D.date)}" onchange="dDate()">
  <label>TEXT</label><textarea id="dt" rows="5" placeholder="きょうのこと…">${esc(D.text)}</textarea>
  <button class="main" onclick="saveDiary()">保存する ${spark(12)}</button></div>
  ${items||'<div class="empty">まだ日記はないよ</div>'}`;
}

function render(){
  $('#orn').innerHTML=SP;
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  $('#app').innerHTML=({home:vHome,week:vWeek,month:vMonth,save:vSave,diary:vDiary,set:vSet})[tab]();
}
render();
</script>

if(firebaseConfig.apiKey!=="YOUR_API_KEY"){
  const app=initializeApp(firebaseConfig);
  const auth=getAuth(app),db=getFirestore(app);
  const box=document.getElementById('acct');
  let unsub=null,timer=null;
  onAuthStateChanged(auth,user=>{
    if(unsub){unsub();unsub=null}
    window.cloudPush=null;
    if(!user){
      box.innerHTML='<button id="li">Googleでログイン</button>';
      document.getElementById('li').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert('ログインできなかったよ: '+e.code));
      return;
    }
    box.innerHTML='<span>同期中</span><button id="lo">ログアウト</button>';
    document.getElementById('lo').onclick=()=>signOut(auth);
    const ref=doc(db,'users',user.uid);
    const push=()=>setDoc(ref,{json:JSON.stringify(S),updated:Date.now()}).catch(e=>console.error(e));
    window.cloudPush=()=>{clearTimeout(timer);timer=setTimeout(push,600)};
    let first=true;
    unsub=onSnapshot(ref,snap=>{
      if(snap.metadata.hasPendingWrites)return;
      const d=snap.exists()?snap.data():null;
      if(first){
        first=false;
        const had=localStorage.getItem('kakeibo-uid')===user.uid;
        try{localStorage.setItem('kakeibo-uid',user.uid)}catch(e){}
        if(!d){push();return}
        if(d.json===JSON.stringify(S))return;
        const empty=S.tx.length===0&&S.goals.length===0;
        if(had||empty||confirm('クラウドにもうデータがあるよ。\nOK＝クラウドのデータを使う\nキャンセル＝この端末のデータでクラウドを上書き'))applyCloud(d.json);
        else push();
        return;
      }
      if(d&&d.json!==JSON.stringify(S))applyCloud(d.json);
    },e=>console.error(e));
  });
}
</script>
