<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おかねびより | ホーム</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22none%22 stroke=%22%236FB8DE%22 stroke-width=%2210%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg0:#080C16;
    --bg1:#121A2E;
    --bg2:#1B2745;
    --ink:#EDF2FB;
    --ink-soft:#9AA8C7;
    --ink-faint:#5F6D8E;
    --glass:rgba(16,23,42,0.56);
    --glass-strong:rgba(16,23,42,0.72);
    --glass-border:rgba(255,255,255,0.10);
    --danger:#FF9285;
    --income-col:#8FD4E8;
    /* テーマカラー（キャラクターのイメージカラー）。JSで動的に上書きされる */
    --acc:#6FB8DE;
    --acc-light:#BFE3F4;
    --acc-dark:#3E86AC;
    --acc-soft:rgba(111,184,222,0.20);
    --acc-glow:rgba(111,184,222,0.45);
    --radius-m:16px;
    --radius-l:24px;
    --radius-xl:28px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    position:relative;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    background:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,0.05), transparent 40%),
      radial-gradient(circle at 85% 15%, var(--acc-soft), transparent 45%),
      linear-gradient(165deg, var(--bg0) 0%, var(--bg1) 45%, var(--bg2) 100%);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:calc(6px + env(safe-area-inset-top,0px)) 8px calc(4px + env(safe-area-inset-bottom,0px));
    overflow:hidden;
  }
  h1,h2,h3,.brand-mini,.date-big,.lv-chip,.card-head,.money-card .mr-val{ font-family:'Zen Maru Gothic', sans-serif; }
  button{ font-family:inherit; cursor:pointer; }
  .icon{ width:1em; height:1em; display:inline-block; vertical-align:-0.15em; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  @keyframes shine-sweep{ 0%{ transform:translateX(-120%); } 100%{ transform:translateX(220%); } }

  .shell{ flex:1; min-height:0; display:flex; flex-direction:column; max-width:1180px; width:100%; margin:0 auto; }

  /* ---------- Top bar ---------- */
  .top-bar{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:2px 4px 6px;
    gap:8px;
  }
  .brand-mini{ font-weight:900; font-size:14px; display:flex; align-items:center; gap:6px; }
  .brand-spark{ color:var(--acc-light); }
  .top-right{ display:flex; align-items:center; gap:6px; }
  .lv-chip{
    display:flex; align-items:center; gap:6px;
    background:var(--glass); border:1px solid var(--glass-border);
    border-radius:16px; padding:4px 9px;
    font-size:10.5px; font-weight:700; color:var(--ink-soft);
    backdrop-filter:blur(10px);
  }
  .lv-chip .lv-num{ color:var(--ink); font-size:11px; }
  .lv-bar-track{ width:44px; height:5px; border-radius:4px; background:rgba(255,255,255,0.12); overflow:hidden; position:relative; }
  .lv-bar-fill{ height:100%; background:linear-gradient(90deg, var(--acc), var(--acc-light)); border-radius:4px; position:relative; overflow:hidden; transition:width .4s ease; }
  .lv-bar-fill::after{
    content:""; position:absolute; inset:0; width:40%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.75), transparent);
    animation:shine-sweep 2.6s ease-in-out infinite;
  }
  .wallet-chip{
    display:flex; align-items:center; gap:5px;
    background:var(--glass); border:1px solid var(--glass-border);
    border-radius:16px; padding:5px 10px; font-weight:800; font-size:11px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 0 0 var(--acc-glow);
    animation:wallet-pulse 3.4s ease-in-out infinite;
  }
  @keyframes wallet-pulse{
    0%,100%{ box-shadow:0 0 0 0 transparent; }
    50%{ box-shadow:0 0 14px 1px var(--acc-glow); }
  }
  .icon-btn{
    position:relative;
    width:30px; height:30px; border-radius:50%;
    background:var(--glass); border:1px solid var(--glass-border);
    color:var(--ink); font-size:13px;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(10px);
    flex-shrink:0;
  }
  .badge-dot{ position:absolute; top:6px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--danger); border:1.5px solid var(--bg1); }

  /* ---------- Dash (メインフレーム / 横画面のゲーム風ウィンドウ) ---------- */
  .dash{
    position:relative;
    flex:1; min-height:0;
    border-radius:var(--radius-xl);
    overflow:hidden;
    background:linear-gradient(160deg, var(--bg1), var(--bg2));
    box-shadow:0 24px 60px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.05), inset 0 0 0 6px rgba(0,0,0,0.15);
  }
  .dash::before{
    content:""; position:absolute; inset:6px; border-radius:calc(var(--radius-xl) - 6px);
    border:1px solid var(--acc-soft); pointer-events:none; z-index:4;
  }
  .dash-corner{
    position:absolute; width:18px; height:18px; z-index:5; color:var(--acc-light); opacity:.85; pointer-events:none;
  }
  .dash-corner svg{ width:100%; height:100%; }
  .dash-corner.tl{ top:10px; left:10px; }
  .dash-corner.tr{ top:10px; right:10px; transform:scaleX(-1); }
  .dash-corner.bl{ bottom:10px; left:10px; transform:scaleY(-1); }
  .dash-corner.br{ bottom:10px; right:10px; transform:scale(-1,-1); }
  .dash-illust{
    position:absolute; inset:0; width:100%; height:100%;
    background-size:cover; background-position:50% 12%;
    transition:opacity .3s ease;
  }
  .dash-illust::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(8,12,22,0.15) 0%, rgba(8,12,22,0) 30%, rgba(8,12,22,0.55) 100%);
  }
  .illust-empty{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    color:var(--ink-soft); text-align:center; padding:14px; z-index:2;
  }
  .illust-empty .ie-icon{ font-size:30px; opacity:.8; }
  .illust-empty .ie-text{ font-size:11px; }
  .btn-upload{
    border:none; border-radius:18px; padding:7px 16px; font-weight:700; font-size:11.5px;
    background:linear-gradient(135deg, var(--acc), var(--acc-dark)); color:#fff;
    box-shadow:0 8px 20px var(--acc-glow);
  }

  .dash-overlay-left{
    position:absolute; left:8px; top:8px; bottom:8px;
    width:clamp(150px,25vw,215px); max-width:44%;
    display:flex; z-index:3;
  }
  .dash-overlay-right{
    position:absolute; right:8px; top:8px; bottom:8px;
    width:clamp(150px,25vw,215px); max-width:40%;
    display:flex; z-index:3;
  }
  .dash-speech{
    position:absolute; left:8px; right:8px; bottom:8px;
    max-width:56%; z-index:3;
    display:flex; align-items:flex-end; gap:8px;
  }

  .glass{
    background:var(--glass); border:1px solid var(--glass-border);
    border-radius:var(--radius-m); backdrop-filter:blur(14px);
    padding:9px 11px;
  }

  /* 左パネル：日付＋スケジュールを1枚のカードにまとめる */
  .panel-left{ width:100%; display:flex; flex-direction:column; min-height:0; }
  .date-row{ display:flex; align-items:baseline; gap:6px; flex-shrink:0; }
  .date-big{ font-size:17px; font-weight:900; line-height:1.1; white-space:nowrap; }
  .date-dow{ font-size:10.5px; color:var(--acc-light); font-weight:700; }
  .date-greeting{
    font-size:9.5px; color:var(--ink-soft); margin-top:2px; line-height:1.4;
    flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .panel-divider{ height:1px; background:var(--glass-border); margin:6px 0; flex-shrink:0; }
  .card-head{
    font-size:10px; font-weight:800; color:var(--ink-soft); letter-spacing:.02em;
    display:flex; align-items:center; justify-content:space-between; gap:6px; flex-shrink:0;
  }
  .card-head-addbtn{
    width:18px; height:18px; border-radius:50%; border:1px solid var(--glass-border);
    background:rgba(255,255,255,0.05); color:var(--ink-soft); font-size:12px; line-height:1;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .sch-list{ flex:1; min-height:0; overflow-y:auto; margin-top:4px; }
  .sch-item{
    display:flex; align-items:baseline; gap:5px; padding:2px 0 2px 7px;
    border-left:2px solid var(--acc); margin-bottom:2px; font-size:10px;
  }
  .sch-item.work{ border-left-color:#F2617E; }
  .sch-time{ color:var(--ink-faint); font-weight:700; flex-shrink:0; }
  .sch-title{ font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sch-empty{ font-size:10px; color:var(--ink-faint); padding:4px 0; }
  .next-block{ margin-top:5px; padding-top:5px; border-top:1px solid var(--glass-border); flex-shrink:0; }
  .next-label{ font-size:8.5px; font-weight:800; color:var(--acc-light); letter-spacing:.06em; }
  .next-item{ font-size:10px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .next-item .ni-time{ color:var(--ink-faint); font-weight:700; margin-right:5px; }

  /* 右パネル：所持金・お知らせ・設定導線を1枚のカードにまとめる */
  .panel-right{ width:100%; display:flex; flex-direction:column; min-height:0; }
  .money-card{ flex-shrink:0; }
  .notice-wrap{ flex:1; min-height:0; overflow-y:auto; margin-top:4px; }
  .speech-tag{
    flex-shrink:0; background:var(--acc); color:#fff; font-weight:800; font-size:10px;
    padding:5px 10px; border-radius:14px; margin-bottom:2px; box-shadow:0 6px 16px var(--acc-glow);
    display:inline-block;
  }
  .speech-bubble{
    background:rgba(255,255,255,0.94); color:#2A3450; border-radius:16px 16px 16px 4px;
    padding:8px 12px; font-size:10.5px; line-height:1.55; font-weight:600;
    box-shadow:0 10px 26px rgba(0,0,0,0.3); white-space:pre-line; max-width:100%;
  }

  .money-card .money-row{
    display:flex; align-items:center; gap:6px; padding:4px 0;
    border-bottom:1px solid var(--glass-border); font-size:10px;
  }
  .money-card .money-row:last-child{ border-bottom:none; }
  .mr-ic{ width:14px; text-align:center; font-size:11px; }
  .mr-label{ flex:1; color:var(--ink-soft); font-weight:700; }
  .mr-val{ font-weight:800; font-size:11px; }
  .mr-val.neg{ color:var(--danger); }
  .mr-val.pos{ color:var(--income-col); }

  .card-head-sm{ font-size:9.5px; font-weight:800; color:var(--ink-soft); }
  .notice-row{ display:flex; align-items:flex-start; gap:5px; font-size:9.5px; padding:2px 0; line-height:1.4; }
  .notice-row .ni-ic{ flex-shrink:0; }
  .notice-row .ni-date{ color:var(--ink-faint); font-size:8.5px; white-space:nowrap; margin-left:4px; }
  .notice-empty{ font-size:9.5px; color:var(--ink-faint); padding:3px 0; }

  .char-settings-link{
    flex-shrink:0; margin-top:4px; padding-top:5px; border-top:1px solid var(--glass-border);
    border:none; background:transparent; text-align:left; display:flex; align-items:center; gap:5px;
    color:var(--acc-light); font-size:9.5px; font-weight:800; width:100%;
  }

  /* ---------- 縦持ちのスマホでは「横にしてね」の案内を出す ---------- */
  .rotate-prompt{ display:none; }
  @media (max-width:900px) and (orientation:portrait){
    .shell{ display:none; }
    .rotate-prompt{
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
      min-height:80vh; text-align:center; color:var(--ink-soft); padding:20px;
    }
    .rotate-prompt .rp-icon{ width:56px; height:56px; color:var(--acc-light); animation:rp-spin 2.4s ease-in-out infinite; }
    .rotate-prompt .rp-title{ font-family:'Zen Maru Gothic',sans-serif; font-weight:800; font-size:16px; color:var(--ink); }
    .rotate-prompt .rp-sub{ font-size:12.5px; line-height:1.7; max-width:280px; }
  }
  @keyframes rp-spin{ 0%,100%{ transform:rotate(0deg); } 50%{ transform:rotate(-90deg); } }

  /* ---------- 星屑の装飾（ソシャゲ風の背景演出） ---------- */
  .twinkle{
    position:absolute; border-radius:50%; background:#fff; pointer-events:none;
    animation:twinkle-fade 3.2s ease-in-out infinite;
  }
  @keyframes twinkle-fade{ 0%,100%{ opacity:.15; } 50%{ opacity:.8; } }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    flex:0 0 auto;
    display:flex; justify-content:space-around;
    background:var(--glass); backdrop-filter:blur(16px);
    border:1px solid var(--glass-border);
    border-radius:16px;
    margin-top:6px;
    padding:4px 6px;
  }
  .nav-item{
    border:none; background:transparent; color:var(--ink-faint);
    display:flex; flex-direction:row; align-items:center; gap:4px; justify-content:center;
    font-size:8.5px; font-weight:700; padding:5px 4px; border-radius:10px; flex:1;
  }
  .nav-item .ic{ font-size:13px; }
  .nav-item.active{ color:var(--acc-light); background:rgba(255,255,255,0.06); }

  /* ---------- モーダル共通 ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,9,18,0.6);
    display:none; align-items:flex-end; justify-content:center; z-index:100;
  }
  .modal-overlay.show{ display:flex; }
  .modal-sheet{
    background:var(--bg1); border:1px solid var(--glass-border);
    width:100%; max-width:520px; border-radius:26px 26px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));
    max-height:88vh; overflow-y:auto; color:var(--ink);
  }
  @media (min-width:640px){
    .modal-overlay{ align-items:center; }
    .modal-sheet{ border-radius:24px; max-height:82vh; }
  }
  .modal-handle{ width:38px; height:4px; border-radius:3px; background:var(--glass-border); margin:0 auto 14px; }
  .modal-title{ font-size:16px; font-weight:800; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
  .modal-close{ border:none; background:rgba(255,255,255,0.08); color:var(--ink); width:30px; height:30px; border-radius:50%; font-size:14px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field .hint{ font-size:11px; color:var(--ink-faint); margin-top:5px; line-height:1.5; }
  input[type=text], input[type=number], input[type=date], input[type=time]{
    width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid var(--glass-border);
    background:rgba(255,255,255,0.05); font-size:14px; color:var(--ink); outline:none;
  }
  input[type=color]{ width:56px; height:40px; border:none; border-radius:10px; background:transparent; padding:0; }
  .theme-color-row{ display:flex; align-items:center; gap:12px; }
  .theme-swatches{ display:flex; gap:8px; flex-wrap:wrap; }
  .theme-swatch{ width:26px; height:26px; border-radius:50%; border:2px solid rgba(255,255,255,0.2); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btn{ border:none; border-radius:12px; padding:12px 18px; font-weight:700; font-size:14px; }
  .btn-primary{ background:linear-gradient(135deg, var(--acc), var(--acc-dark)); color:#fff; width:100%; box-shadow:0 8px 20px var(--acc-glow); }
  .btn-ghost{ background:rgba(255,255,255,0.06); color:var(--ink-soft); border:1.5px solid var(--glass-border); width:100%; }
  .btn-danger-ghost{ background:rgba(255,146,133,0.1); color:var(--danger); border:1.5px solid rgba(255,146,133,0.3); width:100%; }
  .illust-preview{
    width:100%; height:140px; border-radius:14px; background-size:cover; background-position:50% 15%;
    background-color:rgba(255,255,255,0.05); margin-bottom:10px;
    display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-size:12px;
    border:1px solid var(--glass-border);
  }
  .save-toast{
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--bg1); padding:10px 20px; border-radius:20px; font-size:13px;
    font-weight:700; opacity:0; transition:all .25s ease; z-index:200; pointer-events:none;
  }
  .save-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<span class="twinkle" style="width:2px;height:2px;top:6%;left:12%;animation-delay:0s;"></span>
<span class="twinkle" style="width:3px;height:3px;top:14%;left:78%;animation-delay:.6s;"></span>
<span class="twinkle" style="width:2px;height:2px;top:22%;left:45%;animation-delay:1.2s;"></span>
<span class="twinkle" style="width:2px;height:2px;top:65%;left:6%;animation-delay:1.8s;"></span>
<span class="twinkle" style="width:3px;height:3px;top:78%;left:92%;animation-delay:.3s;"></span>
<span class="twinkle" style="width:2px;height:2px;top:88%;left:35%;animation-delay:2.1s;"></span>

<div class="rotate-prompt" id="hp-rotate-prompt">
  <svg class="rp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="2" width="14" height="20" rx="2.5"/>
    <line x1="10" y1="19" x2="14" y2="19"/>
  </svg>
  <div class="rp-title">端末を横向きにしてね</div>
  <div class="rp-sub">このホーム画面は横画面での表示を想定しています。端末を回転するか、ブラウザの画面を横に広げてみてください。</div>
</div>

<div class="shell">
  <header class="top-bar">
    <div class="brand-mini">おかねびより</div>
    <div class="top-right">
      <div class="lv-chip">
        <span class="lv-num">Lv.<span id="hp-lv">1</span></span>
        <div class="lv-bar-track"><div class="lv-bar-fill" id="hp-lv-fill" style="width:0%;"></div></div>
        <span>あと<span id="hp-lv-next">10</span></span>
      </div>
      <div class="wallet-chip"><span class="ic" data-icon="coin" style="font-size:14px;"></span> <span id="hp-wallet-mini">¥0</span></div>
      <button class="icon-btn" id="hp-settings-btn" title="設定"><span class="ic" data-icon="sliders" style="font-size:16px;"></span></button>
    </div>
  </header>

  <main class="dash" id="hp-dash">
    <div class="dash-corner tl" data-icon="cornerBracket"></div>
    <div class="dash-corner tr" data-icon="cornerBracket"></div>
    <div class="dash-corner bl" data-icon="cornerBracket"></div>
    <div class="dash-corner br" data-icon="cornerBracket"></div>
    <div class="dash-illust" id="hp-illust-bg"></div>
    <div class="illust-empty" id="hp-illust-empty">
      <span class="ic" data-icon="image" style="font-size:40px; opacity:.8;"></span>
      <div class="ie-text">キャラクターのイラストを追加してね</div>
      <button type="button" class="btn-upload" id="hp-illust-upload-btn">設定でイラストを追加</button>
    </div>

    <div class="dash-overlay-left">
      <div class="glass panel-left">
        <div class="date-row"><span class="date-big" id="hp-md">09.25</span><span class="date-dow" id="hp-dow">Fri</span></div>
        <div class="date-greeting" id="hp-greeting"></div>
        <div class="panel-divider"></div>
        <div class="card-head">
          <span><span class="ic" data-icon="calendar"></span> SCHEDULE</span>
          <button type="button" class="card-head-addbtn" id="hp-add-schedule" title="予定を追加">＋</button>
        </div>
        <div id="hp-schedule-list" class="sch-list"></div>
        <div class="next-block">
          <div class="next-label">NEXT</div>
          <div id="hp-next-item" class="next-item">予定はありません</div>
        </div>
      </div>
    </div>

    <div class="dash-speech">
      <div>
        <div class="speech-tag" id="hp-char-name">アリス</div>
        <div class="speech-bubble" id="hp-speech-text">おかえり。</div>
      </div>
    </div>

    <div class="dash-overlay-right">
      <div class="glass panel-right">
        <div class="money-card">
